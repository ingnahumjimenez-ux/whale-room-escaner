name: Escaner Bolsa

on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Analizar aunque el mercado esté cerrado (1 = sí)'
        default: '1'

permissions:
  contents: write

concurrency:
  group: escaner-bolsa
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ¿Mercado abierto?
        id: hora
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          n = datetime.now(ZoneInfo('America/New_York'))
          m = n.hour * 60 + n.minute
          abierto = n.weekday() < 5 and 9 * 60 + 30 <= m <= 16 * 60 + 20
          forzar = os.environ.get('FORZAR') == '1'
          print('Hora Nueva York:', n.strftime('%a %H:%M'), '| abierto:', abierto, '| forzar:', forzar)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"correr={'true' if (abierto or forzar) else 'false'}\n")
          PY
        env:
          FORZAR: ${{ github.event.inputs.forzar }}

      - uses: actions/checkout@v4
        if: steps.hora.outputs.correr == 'true'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.correr == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.hora.outputs.correr == 'true'
        with:
          node-version: '22'

      - name: Instalar yfinance
        if: steps.hora.outputs.correr == 'true'
        run: pip install --quiet yfinance

      - name: Descargar velas (Yahoo)
        if: steps.hora.outputs.correr == 'true'
        run: python3 bolsa_descargar.py

      - name: Analizar con el motor de v3
        if: steps.hora.outputs.correr == 'true'
        run: node bolsa_analizar.mjs
        env:
          FORZAR: ${{ github.event.inputs.forzar }}

      - name: Fechas de resultados
        if: steps.hora.outputs.correr == 'true'
        continue-on-error: true
        run: python3 bolsa_resultados.py

      - name: Publicar
        if: steps.hora.outputs.correr == 'true'
        run: |
          git config user.name "escaner-bolsa"
          git config user.email "escaner-bolsa@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Bolsa: datos $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
