name: Escaner Bolsa Plan

on:
  schedule:
    - cron: '20,50 20-23 * * 1-5'
    - cron: '5,25,45 12-14 * * 1-5'
  workflow_dispatch:
    inputs:
      modo:
        description: 'cierre (armar plan de mañana) o pre (confirmación de pre-mercado)'
        default: 'cierre'

permissions:
  contents: write

concurrency:
  group: escaner-bolsa
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: ¿Qué toca hacer?
        id: modo
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          n = datetime.now(ZoneInfo('America/New_York'))
          m = n.hour * 60 + n.minute
          hoy = n.strftime('%Y-%m-%d')
          try:
              P = json.load(open('data/plan.json'))
          except Exception:
              P = {}
          manual = os.environ.get('MANUAL', '')
          modo = 'nada'
          if manual in ('cierre', 'pre'):
              modo = manual
          elif n.weekday() < 5 and 16 * 60 + 5 <= m < 20 * 60:
              if P.get('para', '') <= hoy:
                  modo = 'cierre'
          elif n.weekday() < 5 and 8 * 60 <= m < 9 * 60 + 29:
              if P.get('para') == hoy:
                  modo = 'pre'
          print('Hora Nueva York:', n.strftime('%a %H:%M'), '| plan para:', P.get('para'), '| modo:', modo)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'modo={modo}\n')
          PY
        env:
          MANUAL: ${{ github.event.inputs.modo }}

      - uses: actions/setup-python@v5
        if: steps.modo.outputs.modo != 'nada'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.modo.outputs.modo == 'cierre'
        with:
          node-version: '22'

      - name: Instalar yfinance
        if: steps.modo.outputs.modo != 'nada'
        run: pip install --quiet yfinance

      - name: Cierre · descargar velas
        if: steps.modo.outputs.modo == 'cierre'
        run: python3 bolsa_descargar.py

      - name: Cierre · analizar y armar el plan
        if: steps.modo.outputs.modo == 'cierre'
        run: node bolsa_analizar.mjs
        env:
          FORZAR: '1'
          PLAN: '1'

      - name: Cierre · fechas de resultados
        if: steps.modo.outputs.modo == 'cierre'
        continue-on-error: true
        run: python3 bolsa_resultados.py

      - name: Pre-mercado · confirmar el plan
        if: steps.modo.outputs.modo == 'pre'
        run: python3 bolsa_pre.py

      - name: Publicar
        if: steps.modo.outputs.modo != 'nada'
        run: |
          git config user.name "escaner-bolsa"
          git config user.email "escaner-bolsa@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Bolsa plan (${{ steps.modo.outputs.modo }}): $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
