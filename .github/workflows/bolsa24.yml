name: Escaner Bolsa BingX 24-7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escaner-bolsa-24
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ¿Toca escanear?
        id: hora
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          n = datetime.now(ZoneInfo('America/New_York'))
          m = n.hour * 60 + n.minute
          abierto = n.weekday() < 5 and 9 * 60 + 30 <= m <= 16 * 60 + 10
          cada_hora = datetime.now(timezone.utc).minute < 15
          manual = os.environ.get('EVENTO') == 'workflow_dispatch'
          correr = abierto or cada_hora or manual
          print('Hora Nueva York:', n.strftime('%a %H:%M'), '| bolsa abierta:', abierto, '| turno de cada hora:', cada_hora, '| correr:', correr)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"correr={'true' if correr else 'false'}\n")
          PY
        env:
          EVENTO: ${{ github.event_name }}

      - uses: actions/checkout@v4
        if: steps.hora.outputs.correr == 'true'

      - uses: actions/setup-node@v4
        if: steps.hora.outputs.correr == 'true'
        with:
          node-version: '22'

      - name: Descargar velas de BingX
        if: steps.hora.outputs.correr == 'true'
        run: node bolsa_bingx.mjs
        env:
          CRUDO: /tmp/bolsa24_crudo.json

      - name: Analizar con el motor de v3
        if: steps.hora.outputs.correr == 'true'
        run: node bolsa_analizar.mjs
        env:
          MODO: '24'
          CRUDO: /tmp/bolsa24_crudo.json
          SALIDA: data/bolsa24.json

      - name: Publicar
        if: steps.hora.outputs.correr == 'true'
        run: |
          git config user.name "escaner-bolsa"
          git config user.email "escaner-bolsa@users.noreply.github.com"
          git add data/bolsa24.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Bolsa 24/7: datos $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
